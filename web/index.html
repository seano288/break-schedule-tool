<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Break Schedule Tool — Tracer Bullet</title>
</head>
<body>
    <h1>Break Schedule Tool — Tracer Bullet</h1>
    <p>Proves the Static Web App + managed Functions API deploy end to end.</p>
    <button id="whoami-btn">Who am I?</button>
    <pre id="whoami-result"></pre>

    <script>
        document.getElementById('whoami-btn').addEventListener('click', async () => {
            const result = document.getElementById('whoami-result');
            const response = await fetch('/api/whoami');

            if (response.status === 401) {
                result.textContent = 'Not logged in. Redirecting to login…';
                window.location.href = '/.auth/login/aad';
                return;
            }

            result.textContent = JSON.stringify(await response.json(), null, 2);
        });
    </script>
</body>
</html>
